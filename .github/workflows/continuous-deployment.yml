name: Continuos Integration and Delivery with Github Actions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}


    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build Application .jar
      run: mvn clean package

    - name: Docker Compose Build
      run: docker compose build

    - name: Push to Docker Hub Container Registry
      run:  |
        docker tag ${{ secrets.DOCKER_USERNAME }}/java-springboot-erudio:latest \
        ${{ secrets.DOCKER_USERNAME }}/java-springboot-erudio:${{ github.run_id }}
        
        docker push ${{ secrets.DOCKER_USERNAME }}/java-springboot-erudio:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/java-springboot-erudio:${{ github.run_id }}

